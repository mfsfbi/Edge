<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><header class="top"><a class="brand" href="{{ url_for('home') }}">O</a><nav><a href="{{ url_for('services') }}">Services</a><a href="{{ url_for('people') }}">People</a>{% if session.get('admin_ok') %}<a href="{{ url_for('admin_people') }}">Control room</a>{% endif %}</nav></header>{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flashes">{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}<footer>All rights reserved.</footer></body></html>
