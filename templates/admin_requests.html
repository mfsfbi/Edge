{% extends 'base.html' %}{% block content %}<main class="shell"><section class="page"><div class="admin-head"><div><div class="eyebrow">CONTROL ROOM</div><h1>Requests</h1></div><a class="button ghost" href="{{url_for('admin_people')}}">People</a></div><div class="table-wrap"><table><thead><tr><th>Time</th><th>Person</th><th>Service</th><th>Destination</th><th>Status</th></tr></thead><tbody>{% for r in requests %}<tr><td>{{r.created_at}}</td><td>{{r.full_name or 'Guest'}}</td><td>{{r.service}}</td><td>{{r.destination}}</td><td>{{r.status}}</td></tr>{% else %}<tr><td colspan="5">No requests yet.</td></tr>{% endfor %}</tbody></table></div></section></main>{% endblock %}
