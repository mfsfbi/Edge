{% extends 'o_base.html' %}
{% block content %}
<section class="o-request-shell">
  <div class="o-request-toolbar"><a href="{{ url_for('o.services') }}">←</a><div><span class="o-kicker">REQUEST</span><strong id="serviceTitle">{{ default_service }}</strong></div><span id="liveDot" class="o-live-dot">LIVE</span></div>
  <div id="oMap" class="o-map"></div>
  <div class="o-map-controls"><button type="button" id="locateBtn">◎ Locate</button><button type="button" id="pickupBtn" class="active">Pickup</button><button type="button" id="destinationBtn">Destination</button></div>
  <form class="o-bottom-sheet" method="post" id="requestForm">
    <input type="hidden" name="service" id="serviceInput" value="{{ default_service }}"><input type="hidden" name="pickup_lat" id="pickupLat"><input type="hidden" name="pickup_lon" id="pickupLon"><input type="hidden" name="destination_lat" id="destinationLat"><input type="hidden" name="destination_lon" id="destinationLon">
    <input type="hidden" name="pickup_label" value="Current location"><input type="hidden" name="destination_label" value="Selected destination">
    <div class="o-route-row"><div><span>Pickup</span><strong id="pickupReadout">Finding you…</strong></div><div><span>Destination</span><strong id="destinationReadout">Tap the map</strong></div></div>
    {% if not session.get('user_id') %}<div class="o-guest-grid"><input name="name" placeholder="Name" autocomplete="name"><input name="phone" placeholder="Phone" autocomplete="tel"></div>{% endif %}
    <div class="o-payment-row"><div class="o-payment-pills">{% for p in ['Cash','M-Pesa','Card'] %}<label><input type="radio" name="payment_method" value="{{ p }}" {% if loop.first %}checked{% endif %}><span>{{ p }}</span></label>{% endfor %}</div><div class="o-estimate" id="estimate">Route needed</div></div>
    <button class="o-primary-button" id="requestBtn" type="submit">Request O</button>
  </form>
</section>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const map=L.map('oMap',{zoomControl:false,preferCanvas:true}).setView([-1.2864,36.8172],12);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let mode='pickup', pickup=null,destination=null,pickMarker=null,destMarker=null,routeLayer=null;
const $=id=>document.getElementById(id);
function markerIcon(kind){return L.divIcon({className:'o-marker-wrap',html:`<div class="o-marker ${kind}"><span>${kind==='pickup'?'O':'•'}</span></div>`,iconSize:[32,32],iconAnchor:[16,16]})}
function setPoint(which,latlng){const p={lat:latlng.lat,lon:latlng.lng};if(which==='pickup'){pickup=p;$('pickupLat').value=p.lat;$('pickupLon').value=p.lon;$('pickupReadout').textContent=`${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}`;if(!pickMarker)pickMarker=L.marker(latlng,{icon:markerIcon('pickup'),draggable:true}).addTo(map);else pickMarker.setLatLng(latlng);pickMarker.off('dragend').on('dragend',e=>setPoint('pickup',e.target.getLatLng()));}else{destination=p;$('destinationLat').value=p.lat;$('destinationLon').value=p.lon;$('destinationReadout').textContent=`${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}`;if(!destMarker)destMarker=L.marker(latlng,{icon:markerIcon('dest'),draggable:true}).addTo(map);else destMarker.setLatLng(latlng);destMarker.off('dragend').on('dragend',e=>setPoint('destination',e.target.getLatLng()));}updateRoute();}
async function updateRoute(){if(!pickup||!destination){$('estimate').textContent='Route needed';$('requestBtn').disabled=true;return}$('estimate').textContent='Routing…';$('requestBtn').disabled=true;try{const q=new URLSearchParams({a_lat:pickup.lat,a_lon:pickup.lon,b_lat:destination.lat,b_lon:destination.lon});const r=await fetch('{{ url_for('o.route_api') }}?'+q);const data=await r.json();if(!r.ok||!data.ok)throw new Error('route');const coords=data.route.geometry.coordinates.map(c=>[c[1],c[0]]);if(routeLayer)routeLayer.remove();routeLayer=L.polyline(coords,{className:'o-route-line',weight:6}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[50,130]});const km=data.route.distance_m/1000,mins=Math.max(1,Math.round(data.route.duration_s/60));const service=$('serviceInput').value;let base=service==='O-Ride'?150:service==='O-Drive'?250:800;let rate=service==='O-Ride'?55:service==='O-Drive'?65:85;const fare=Math.round((base+rate*km)*100)/100;$('estimate').textContent=`${km.toFixed(1)} km · ${mins} min · KSh ${fare.toLocaleString()}`;$('requestBtn').disabled=false;}catch(e){$('estimate').textContent='Route unavailable';}}
map.on('click',e=>setPoint(mode,e.latlng));
$('pickupBtn').onclick=()=>{mode='pickup';$('pickupBtn').classList.add('active');$('destinationBtn').classList.remove('active')};$('destinationBtn').onclick=()=>{mode='destination';$('destinationBtn').classList.add('active');$('pickupBtn').classList.remove('active')};
$('locateBtn').onclick=()=>locate();
function locate(){if(!navigator.geolocation){$('pickupReadout').textContent='Location unavailable';return}$('pickupReadout').textContent='Locating…';navigator.geolocation.getCurrentPosition(pos=>{const ll={lat:pos.coords.latitude,lng:pos.coords.longitude};map.setView(ll,16);setPoint('pickup',ll);mode='destination';$('destinationBtn').click();},()=>{$('pickupReadout').textContent='Location unavailable';},{enableHighAccuracy:true,timeout:10000,maximumAge:30000});}
setTimeout(locate,200);
$('requestForm').addEventListener('submit',e=>{if(!pickup||!destination){e.preventDefault();alert('Choose pickup and destination on the map.')}});
</script>{% endblock %}
