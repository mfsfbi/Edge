{% extends 'base.html' %}{% block title %}Join O — O{% endblock %}{% block content %}<div style="max-width:620px;margin:20px auto" class="card"><h1>Join O</h1>{% if error %}<div class="notice">{{error}}</div>{% endif %}<form class="form" method="post"><label>What are you joining as?<select name="role" id="role" onchange="toggleDriver()"><option value="customer">Customer</option><option value="driver">O partner (boda / car / mover)</option></select></label><input name="name" placeholder="Full name" required><input name="phone" placeholder="Phone" required><input name="password" type="password" placeholder="Password (6+ characters)" required><div id="driverFields" style="display:none" class="form"><select name="service"><option value="bike">O-Ride — boda</option><option value="ride">O-Drive — car</option><option value="mover">O-Movers — mover</option></select><input name="vehicle_label" placeholder="Vehicle description"><input name="plate" placeholder="Plate / vehicle identifier"><input name="license_no" placeholder="License / operating document number"></div><button class="btn primary">Create account</button></form><div class="small" style="margin-top:12px">Driver accounts are verified by O before they can receive jobs. Joining is free during launch.</div></div>{% endblock %}{% block scripts %}<script>function toggleDriver(){document.getElementById('driverFields').style.display=document.getElementById('role').value==='driver'?'grid':'none'}</script>{% endblock %}
