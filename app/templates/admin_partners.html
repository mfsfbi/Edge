{% extends 'base.html' %}{% block content %}<div class="section-title"><div><div class="kicker">Admin</div><h1>Partners</h1></div></div><div class="split"><div class="card"><h2>Add partner</h2><form class="form" method="post"><input class="input" name="name" placeholder="Full name" required><input class="input" name="username" placeholder="Username" required><input class="input" type="password" name="password" placeholder="Password" required><select class="select" name="service"><option value="ride">O-Ride</option><option value="drive">O-Drive</option><option value="mover">O-Movers</option></select><input class="input" name="phone" placeholder="Phone"><input class="input" name="vehicle" placeholder="Vehicle"><input class="input" name="plate" placeholder="Plate"><input class="input" name="licence" placeholder="Licence"><button class="btn primary">Create partner</button></form></div><div class="card"><h2>Created partners</h2><div class="tablewrap"><table class="table"><thead><tr><th>Partner</th><th>Service</th><th>Active</th><th></th></tr></thead><tbody>{% for p in partners %}<tr><td>{{p.name}}<div class="muted">{{p.username}}</div></td><td>{{p.service}}</td><td>{{'Yes' if p.active else 'No'}}</td><td><form method="post" action="/promise212324/partner/{{p.id}}/toggle"><button class="btn">{{'Deactivate' if p.active else 'Activate'}}</button></form></td></tr>{% else %}<tr><td colspan="4">None.</td></tr>{% endfor %}</tbody></table></div></div></div>{% endblock %}
