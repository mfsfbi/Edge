{% extends 'o_base.html' %}
{% block content %}<section class="o-dashboard"><div class="o-dash-head"><div><span class="o-kicker">MY O</span><h1>{{ user.name }}</h1></div><a class="o-secondary-button" href="{{ url_for('public.logout') }}">Lock</a></div><div class="o-request-list">{% for r in requests %}<a class="o-provider-request" href="{{ url_for('o.request_status',request_id=r.id) }}"><div><span class="o-kicker">{{r.service_type}} · #{{r.id}}</span><h2>{{r.status}}</h2><p>{{r.pickup_label}} → {{r.destination_label}}</p></div><b>→</b></a>{% else %}<div class="o-empty">No O requests yet.</div>{% endfor %}</div></section>{% endblock %}
