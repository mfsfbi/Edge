{% extends 'base.html' %}{% block content %}<div style="max-width:560px;margin:40px auto"><div class="card"><div class="kicker">O Account</div><h1>Create your account</h1><p class="muted">Save your trips, rate rides, manage feedback and get a smoother O experience.</p>{% if error %}<div class="notice" style="border-color:#63323d;margin:12px 0">{{error}}</div>{% endif %}<form class="form" method="post"><div><div class="label">Name</div><input class="input" name="name" required></div><div><div class="label">Username</div><input class="input" name="username" required autocomplete="username"></div><div><div class="label">Phone (optional)</div><input class="input" name="phone"></div><div><div class="label">Password</div><input class="input" type="password" name="password" required minlength="6"></div><button class="btn primary">Create account</button></form></div></div>{% endblock %}
