{% extends 'base.html' %}
{% block content %}<div style="max-width:720px;margin:auto"><div class="kicker">Partner support</div><h1><span class="sw">Msaada</span><span class="en">Help</span></h1><div class="card" style="margin-top:14px"><p class="muted"><span class="sw">Tuma tatizo, ombi au swali kwa O.</span><span class="en">Send O a problem, request or question.</span></p><form class="form" method="post" action="/help"><input type="hidden" name="kind" value="partner_help"><textarea class="textarea" name="message" required></textarea><button class="btn primary" type="submit"><span class="sw">Tuma</span><span class="en">Send</span></button></form></div></div><script>const lang=localStorage.getItem('partnerLang')||'sw';document.querySelectorAll('.sw').forEach(x=>x.style.display=lang==='sw'?'inline':'none');document.querySelectorAll('.en').forEach(x=>x.style.display=lang==='en'?'inline':'none');</script>{% endblock %}
