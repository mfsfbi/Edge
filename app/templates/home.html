{% extends 'base.html' %}
{% block title %}O{% endblock %}
{% block top_title %}O{% endblock %}
{% block content %}
<section class="o-home">
  <div class="o-mark o-mark-main" aria-label="O">O</div>
  <div class="service-heading">O-Services</div>
  <div class="service-launcher">
    <a class="service-button ride" href="/service/bike"><span>O-Ride</span><small>Bike rides</small></a>
    <a class="service-button drive" href="/service/ride"><span>O-Drive</span><small>Car rides</small></a>
    <a class="service-button movers" href="/service/mover"><span>O-Movers</span><small>Moving</small></a>
    <a class="service-button travels" href="https://otravel-bleg.onrender.com/"><span>O-Travels</span><small>Travel</small></a>
  </div>
  <div class="home-actions">
    {% if user and user['role']=='customer' %}<a class="home-link" href="/dashboard">My O</a>{% else %}<a class="home-link" href="/login">Log in</a>{% endif %}
    <a class="home-link" href="/qr">Share O</a>
  </div>
</section>
{% endblock %}
