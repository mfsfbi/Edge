{% extends 'base.html' %}
{% block head %}<meta http-equiv="Cache-Control" content="no-store">{% endblock %}
{% block content %}
<div class="entry-stage" id="entryStage">
  <div class="entry-orbit" aria-hidden="true">
    <svg viewBox="0 0 220 220"><circle class="o-track" cx="110" cy="110" r="78"></circle><circle class="o-draw" cx="110" cy="110" r="78"></circle></svg>
  </div>
  <div class="entry-word" id="entryWord">Warm service.</div>
  <div class="entry-sub" id="entrySub">Simple journeys. Friendly people.</div>
  <div class="entry-qr"><a class="qr-placeholder" href="/services"><img src="/qr-image.svg" alt="O QR code"></a><div><b>O QR</b><span>Scan or tap to open O Services.</span></div></div>
  <a class="btn primary entry-continue" id="entryContinue" href="/services">Continue</a>
</div>
{% endblock %}
{% block scripts %}
<script>
(function(){
 const stage=document.getElementById('entryStage'), word=document.getElementById('entryWord'), sub=document.getElementById('entrySub'), enter=document.getElementById('entryContinue');
 const messages=[['Warm service.','Simple journeys. Friendly people.'],['Move with O.','Easy to start. Easy to understand.']]; let i=0;
 setTimeout(()=>{i=1;word.textContent=messages[i][0];sub.textContent=messages[i][1]},1350);
 setTimeout(()=>stage.classList.add('ready'),2200);
 setTimeout(()=>{if(document.visibilityState==='visible') window.location.replace('/services')},3600);
 enter.addEventListener('click',()=>stage.classList.add('leave'));
})();
</script>
{% endblock %}
