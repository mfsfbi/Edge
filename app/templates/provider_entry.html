{% extends 'base.html' %}{% block content %}<div style="max-width:480px;margin:40px auto"><div class="card"><div class="kicker">Partner access</div><h1>{{service_name}}</h1><p class="muted">Log in with the account O created for you.</p>{% if error %}<div class="notice" style="border-color:#63323d;margin:12px 0">{{error}}</div>{% endif %}<form class="form" method="post" action="/provider-login"><input type="hidden" name="service" value="{{service}}"><div><div class="label">Name / Username</div><input class="input" name="username" required autocomplete="username"></div><div><div class="label">Password</div><input class="input" type="password" name="password" required></div><button class="btn primary">Enter {{service_name}}</button></form></div></div>{% endblock %}
