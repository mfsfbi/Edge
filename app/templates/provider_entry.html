{% extends 'base.html' %}
{% block head %}<style>.entry-partner{max-width:480px;margin:8vh auto}.entry-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 16px 40px rgba(25,45,65,.09)}.entry-choose{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.entry-choose span{padding:7px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:10px;font-weight:900}.entry-title{font-size:34px;line-height:1;margin:5px 0 6px}@media(max-width:620px){.entry-partner{margin:4vh auto}.content{padding:14px}}</style>{% endblock %}
{% block content %}<div class="entry-partner"><div class="entry-card"><div class="kicker">O partner access</div><h1 class="entry-title">{{service_name}}</h1>{% if error %}<div class="notice" style="margin:12px 0;border-color:#df9ba6">{{error}}</div>{% endif %}<form class="form" method="post" action="{{action}}"><input type="hidden" name="service" value="{{service}}"><div><div class="label">Name / Username</div><input class="input" name="username" required autocomplete="username"></div><div><div class="label">Password</div><div class="password-field"><input class="input" id="providerPassword" type="password" name="password" required autocomplete="current-password"><button type="button" class="password-toggle" data-password-toggle="providerPassword">Show</button></div></div><button class="btn primary" style="width:100%;min-height:52px">Enter {{service_name}}</button></form></div></div>{% endblock %}
