{% extends 'base.html' %}
{% block content %}
<style>
.partner-entry{max-width:860px;margin:5vh auto;padding:0 12px}
.partner-head{text-align:center;margin-bottom:22px}
.partner-head h1{margin:6px 0;font-size:32px}.partner-head p{margin:0;color:var(--muted)}
.role-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.role-card{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:210px;padding:22px;border:1px solid var(--line);border-radius:22px;background:var(--panel);color:var(--text);text-decoration:none;cursor:pointer;touch-action:manipulation;pointer-events:auto;box-shadow:0 12px 28px rgba(25,45,65,.08);transition:.15s ease}
.role-card:active{transform:scale(.985)}.role-card:hover,.role-card:focus-visible{transform:translateY(-2px);outline:none;border-color:#aebdca;box-shadow:0 16px 32px rgba(25,45,65,.12)}
.role-icon{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;margin-bottom:16px;font-size:28px;font-weight:900;border:1px solid var(--line)}
.role-icon svg{width:45px;height:45px;fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.role-card.ride .role-icon{background:#fff5cf;color:#a46e00}.role-card.drive .role-icon{background:#e9f8ef;color:#167847}.role-card.mover .role-icon{background:#eaf3ff;color:#2d6dcb}
.role-card b{font-size:20px}.role-card span{margin-top:5px;color:var(--muted);font-size:14px}
@media(max-width:700px){.role-grid{grid-template-columns:1fr;gap:12px}.role-card{min-height:145px;flex-direction:row;justify-content:flex-start;text-align:left;padding:16px}.role-icon{width:62px;height:62px;border-radius:18px;margin:0 16px 0 0}.role-icon svg{width:38px;height:38px}.role-card b{font-size:18px}.partner-head h1{font-size:27px}}
</style>
<div class="partner-entry">
  <div class="partner-head"><div class="kicker">O Partners</div><h1>Chagua eneo lako la kazi</h1><p>Chagua huduma uliyopangiwa na Admin.</p></div>
  <div class="role-grid">
    <a class="role-card ride" href="/partners/ride" onclick="window.location.href='/partners/ride';return false;">
      <div class="role-icon"><svg viewBox="0 0 72 72"><circle cx="18" cy="54" r="8"/><circle cx="53" cy="54" r="8"/><path d="M25 54h15l-5-22h-10l-8 22M29 32l7-12h10M46 20l6 12"/></svg></div><div><b>Rider</b><span>O-Ride</span></div>
    </a>
    <a class="role-card drive" href="/partners/drive" onclick="window.location.href='/partners/drive';return false;">
      <div class="role-icon"><svg viewBox="0 0 72 72"><path d="M10 46l6-18c1-4 4-6 8-6h24c4 0 7 2 8 6l6 18v9H10z"/><path d="M20 29l5-9h22l5 9M18 47h36"/><circle cx="22" cy="51" r="4"/><circle cx="50" cy="51" r="4"/></svg></div><div><b>Driver</b><span>O-Drive</span></div>
    </a>
    <a class="role-card mover" href="/partners/mover" onclick="window.location.href='/partners/mover';return false;">
      <div class="role-icon"><svg viewBox="0 0 72 72"><path d="M8 25h35v31H8zM43 34h13l8 9v13H43z"/><circle cx="20" cy="58" r="7"/><circle cx="54" cy="58" r="7"/><path d="M16 33h17M16 40h17M16 47h11"/></svg></div><div><b>Mover</b><span>O-Movers</span></div>
    </a>
  </div>
</div>
{% endblock %}
