{% extends 'base.html' %}{% block content %}<div class="grid2"><div class="card"><h1>Help & complaints</h1><form class="form" method="post"><input name="request_id" placeholder="Request ID (optional)"><select name="category"><option>fare</option><option>driver</option><option>customer</option><option>safety</option><option>app</option><option>other</option></select><textarea name="details" rows="7" placeholder="Tell O what happened" required></textarea><button class="btn primary">Send to O Admin</button></form></div><div class="card"><h2>Your cases</h2><table class="table"><tr><th>#</th><th>Category</th><th>Status</th><th>Details</th></tr>{% for r in rows %}<tr><td>{{r['id']}}</td><td>{{r['category']}}</td><td>{{r['status']}}</td><td>{{r['details']}}</td></tr>{% else %}<tr><td colspan="4" class="small">No complaints.</td></tr>{% endfor %}</table></div></div>{% endblock %}
