{% extends 'base.html' %}{% block head %}<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">{% endblock %}{% block content %}<div class="section-title"><div><div class="kicker">Customer</div><h1>{{service_name}}</h1></div></div><div class="split"><div class="card"><form id="rideForm" class="form"><div><div class="label">Pickup</div><div class="row"><input class="input" id="pickupName" placeholder="Use current location or enter pickup"><button type="button" class="btn" onclick="useLocation('pickup')">Use location</button></div><input type="hidden" id="pickupLat"><input type="hidden" id="pickupLon"></div><div><div class="label">Destination</div><input class="input" id="destSearch" placeholder="Search destination"><div id="suggestions"></div><div class="row" style="margin-top:8px"><button type="button" class="btn" onclick="searchDest()">Find destination</button><button type="button" class="btn" onclick="chooseMapDest()">Choose on map</button></div><input type="hidden" id="destLat"><input type="hidden" id="destLon"></div><div><div class="label">Payment</div><select class="select" id="payment"><option>Cash</option><option>M-Pesa</option><option>Card</option></select></div><div><div class="label">Name for guest request (optional)</div><input class="input" id="guestName"></div><div class="notice" id="fareBox">Choose pickup and destination to calculate the fare.</div><button type="submit" class="btn primary">Request {{service_name}}</button></form></div><div class="card"><div id="map" class="mapbox"></div></div></div><script>
const service='{{service}}';const map=L.map('map').setView([-1.2864,36.8172],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let pickupMarker,destMarker,route;
function pin(kind,lat,lon,name){let m=kind==='pickup'?pickupMarker:destMarker;if(m)m.remove();m=L.marker([lat,lon]).addTo(map).bindPopup(name||kind);if(kind==='pickup')pickupMarker=m;else destMarker=m;map.setView([lat,lon],14);}
function useLocation(kind){navigator.geolocation?.getCurrentPosition(p=>{if(kind==='pickup'){pickupLat.value=p.coords.latitude;pickupLon.value=p.coords.longitude;pickupName.value='Current location';pin('pickup',p.coords.latitude,p.coords.longitude,'Pickup');}},{enableHighAccuracy:true})}
async function searchDest(){const q=destSearch.value.trim();if(!q)return;const r=await fetch('/api/geocode/search?q='+encodeURIComponent(q));const data=await r.json();suggestions.innerHTML=data.map((x,i)=>`<button type="button" class="btn" style="width:100%;justify-content:flex-start;margin-top:5px" onclick="selectDest(${i})">${x.name}</button>`).join('');window._results=data}
function selectDest(i){const x=window._results[i];destLat.value=x.lat;destLon.value=x.lon;destSearch.value=x.name;destMarker&&destMarker.remove();pin('destination',x.lat,x.lon,x.name);calcRoute()}
function chooseMapDest(){window._choose=true;alert('Tap the map where you want to go.');}
map.on('click',e=>{if(!window._choose)return;window._choose=false;destLat.value=e.latlng.lat;destLon.value=e.latlng.lng;destSearch.value='Map destination';pin('destination',e.latlng.lat,e.latlng.lng,'Destination');calcRoute()})
async function calcRoute(){if(!pickupLat.value||!destLat.value)return;const r=await fetch(`/api/route?olat=${pickupLat.value}&olon=${pickupLon.value}&dlat=${destLat.value}&dlon=${destLon.value}`);if(!r.ok){fareBox.textContent='Road route is temporarily unavailable. Please try again.';return}const x=await r.json();fareBox.textContent=`Estimated fare: KES ${Math.round(Math.max({ride:60,drive:150,mover:700}[service],({ride:55,drive:110,mover:600}[service]+x.distance_km*{ride:18,drive:42,mover:60}[service]))/10)*10} · ${x.distance_km.toFixed(1)} km`;if(route)route.remove();route=L.polyline(x.geometry,{color:'#59a9ff',weight:6,opacity:.9}).addTo(map);map.fitBounds(route.getBounds(),{padding:[20,20]})}
rideForm.addEventListener('submit',async e=>{e.preventDefault();if(!pickupLat.value||!destLat.value){alert('Choose pickup and destination first.');return}const rr=await fetch(`/api/route?olat=${pickupLat.value}&olon=${pickupLon.value}&dlat=${destLat.value}&dlon=${destLon.value}`);if(!rr.ok){alert('Road route unavailable.');return}const rt=await rr.json();const r=await fetch('/api/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service,pickup:{name:pickupName.value,lat:+pickupLat.value,lon:+pickupLon.value},destination:{name:destSearch.value,lat:+destLat.value,lon:+destLon.value},distance_km:rt.distance_km,payment:payment.value,guest_name:guestName.value})});const x=await r.json();if(x.ok){fareBox.innerHTML=`<b>Request sent.</b> ${x.assigned?'Matched with '+x.assigned: 'O is finding an available partner.'} Fare: KES ${x.fare}`;}else alert(x.error||'Unable to request');});
useLocation('pickup');
</script>{% endblock %}
