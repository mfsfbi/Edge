{% extends 'base.html' %}
{% block title %}{{name}} — O{% endblock %}
{% block content %}
<div class="grid2">
  <div class="card">
    <div class="small">{{name|upper}}</div>
    <h1>{{name}}</h1>
    <div class="form">
      <label>Pickup<input id="pickup" autocomplete="street-address" placeholder="Your current location or search a place"></label>
      <button class="btn" type="button" onclick="useLocation()">Use my location</button>
      <label>Destination<input id="destination" autocomplete="street-address" placeholder="Where are you going?"></label>
      <button class="btn" type="button" onclick="findDestination()">Find destination</button>
      <div id="locationState" class="status">Finding your pickup…</div>
      <input id="plat" type="hidden"><input id="plng" type="hidden"><input id="dlat" type="hidden"><input id="dlng" type="hidden">
      {% if service=='mover' %}<div class="grid2"><label>Items<input id="items" type="number" min="0" value="0"></label><label>Helpers<input id="helpers" type="number" min="0" value="0"></label></div>{% endif %}
      <label>Payment<select id="payment"><option value="cash">Cash</option><option value="mpesa">M-Pesa</option><option value="card">Card / wallet</option></select></label>
      <label class="guestPhone">Phone <span class="small">(optional)</span><input id="contact_phone" inputmode="tel" autocomplete="tel" placeholder="07xx xxx xxx"></label>
      <div class="actions mobile-actions"><button class="btn primary" onclick="requestO('{{service}}')">Request {{name}}</button></div>
    </div>
  </div>
  <div class="card">
    <div id="map" class="map"></div>
    <div style="display:flex;justify-content:space-between;gap:16px;margin-top:12px;align-items:flex-end">
      <div><div class="small">Your estimated fare</div><div id="fare" class="big">—</div></div>
      <div style="text-align:right"><div class="small">Status</div><div id="status" class="status">Ready</div></div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}<script>window.OService='{{service}}';initServiceMap();</script>{% endblock %}
