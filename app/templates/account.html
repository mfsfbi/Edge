{% extends 'base.html' %}{% block content %}<div style="max-width:620px;margin:28px auto"><div class="card"><div class="kicker">Your O account</div><h1>Account</h1>{% if success %}<div class="notice" style="border-color:#275e43;color:#8cf2ae">{{success}}</div>{% endif %}{% if error %}<div class="notice" style="border-color:#63323d">{{error}}</div>{% endif %}<form class="form" method="post"><div><div class="label">Name</div><input class="input" name="name" value="{{account.name}}" required></div><div><div class="label">Username</div><input class="input" value="{{account.username}}" disabled></div><div><div class="label">Phone</div><input class="input" name="phone" value="{{account.phone or ''}}"></div><button class="btn primary">Save changes</button></form></div></div>{% endblock %}
