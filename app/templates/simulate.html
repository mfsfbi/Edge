{% extends 'base.html' %}{% block head %}<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">{% endblock %}{% block content %}<div class="section-title"><div><div class="kicker">Admin simulation</div><h1>End-to-end O trip</h1></div><form method="post" action="/promise212324/simulate/toggle"><button class="btn {% if enabled %}green{% else %}gold{% endif %}">Simulation {{'ON' if enabled else 'OFF'}}</button></form></div><div class="split"><div class="card"><div class="row"><span class="badge status-orange">AVAILABLE</span><span class="badge status-green">ASSIGNED</span><span class="badge status-blue">ON TRIP</span></div><h2 style="margin-top:18px">Live journey</h2><p class="muted">Simulation demonstrates the same provider states and nearest-match sequence without creating a real customer charge.</p><div id="steps"></div></div><div class="card"><div id="simMap" class="map" style="height:420px"></div></div></div><script>
const enabled={{'true' if enabled else 'false'}};const m=L.map('simMap').setView([-1.2864,36.8172],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);let routeLine=null;let provider=[-1.285,36.807],pickup=[-1.279,36.825],dest=[-1.300,36.840];let pm=L.circleMarker(provider,{radius:12,color:'#ffad43',fillColor:'#ffad43',fillOpacity:.9}).addTo(m).bindPopup('O-Ride partner');let cm=L.circleMarker(pickup,{radius:10,color:'#fff',fillColor:'#fff',fillOpacity:.85}).addTo(m).bindPopup('Customer');let dm=L.circleMarker(dest,{radius:10,color:'#fff',fillColor:'#fff',fillOpacity:.85}).addTo(m).bindPopup('Destination');m.fitBounds([provider,pickup,dest],{padding:[25,25]});
async function road(a,b){try{const r=await fetch('/api/route?olat='+a[0]+'&olon='+a[1]+'&dlat='+b[0]+'&dlon='+b[1]);if(!r.ok)throw 1;return (await r.json()).geometry}catch(e){return null}}
async function run(){if(!enabled){document.getElementById('steps').innerHTML='<div class="notice">Turn Simulation ON to run.</div>';return} const s=document.getElementById('steps');const phases=[['Searching nearest partner','status-orange',1200],['Partner assigned','status-green',1800],['Partner approaching','status-green',2200],['Passenger onboard','status-blue',2800],['Trip completed','status-orange',1200]];for(const p of phases){s.innerHTML='<div class="notice" style="margin-top:12px"><span class="badge '+p[1]+'">'+p[0]+'</span></div>';await new Promise(r=>setTimeout(r,p[2]));}const g=await road(pickup,dest);if(g)routeLine=L.polyline(g,{color:'#59a9ff',weight:6,opacity:.85}).addTo(m)}run();
</script>{% endblock %}
