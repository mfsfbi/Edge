{% extends 'base.html' %}{% block content %}<div style="max-width:720px;margin:20px auto"><div class="card"><div class="kicker">Appearance</div><h1>Choose your O look</h1><p class="muted">Your selection only changes your signed-in experience.</p>{% if success %}<div class="notice success">{{success}}</div>{% endif %}{% if error %}<div class="notice error">{{error}}</div>{% endif %}<form class="form" method="post"><div class="theme-grid"><label class="theme-option"><input type="radio" name="theme" value="light" {% if account.theme=='light' %}checked{% endif %}><span class="theme-swatch light-swatch"></span><b>Clean Light</b><small>Bright white and soft grey</small></label><label class="theme-option"><input type="radio" name="theme" value="cream" {% if account.theme=='cream' %}checked{% endif %}><span class="theme-swatch cream-swatch"></span><b>Warm Cream</b><small>Soft and welcoming</small></label><label class="theme-option"><input type="radio" name="theme" value="mint" {% if account.theme=='mint' %}checked{% endif %}><span class="theme-swatch mint-swatch"></span><b>Fresh Mint</b><small>Cool green accents</small></label><label class="theme-option"><input type="radio" name="theme" value="sky" {% if account.theme=='sky' %}checked{% endif %}><span class="theme-swatch sky-swatch"></span><b>Open Sky</b><small>Light blue accents</small></label></div><button class="btn primary" type="submit">Save appearance</button></form></div></div>{% endblock %}
