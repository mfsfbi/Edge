{% extends 'base.html' %}{% block content %}<div style="max-width:480px;margin:40px auto"><div class="card"><div class="kicker">O Access</div><h1>Sign in</h1><p class="muted">Customers and O partners use the same name/username + password here.</p>{% if error %}<div class="notice" style="border-color:#63323d;margin:12px 0">{{error}}</div>{% endif %}<form class="form" method="post"><div><div class="label">Name / Username</div><input class="input" name="username" required autocomplete="username"></div><div><div class="label">Password</div><input class="input" type="password" name="password" required autocomplete="current-password"></div><button class="btn primary">Sign in</button></form><div style="margin-top:14px" class="muted">New customer? <a href="/account/register" style="text-decoration:underline">Create an account</a></div></div></div>{% endblock %}
