{% block head %}{% endblock %}</head><body class="user-shell">
<div class="top"><div class="topbar"><div class="mobile-brand"><button class="hamb" id="openDrawer" aria-label="Open menu"><span></span><span></span><span></span></button><img src="/static/logo.svg" alt="O"><span>O</span></div><a class="btn" href="/qr">O QR</a></div></div>
<div class="drawer" id="drawer"><div class="panel"><div class="brand"><img src="/static/logo.svg" alt="O"><strong>O</strong></div><div id="drawerNav"></div><a class="side-qr" href="/qr"><img src="/qr-image.svg" alt="O QR"><span>O QR<br><small>Open or scan</small></span></a><button class="btn install-btn" id="installO" style="width:100%;margin-top:8px;display:none">Install O</button><div class="sidefooter">All rights reserved.</div></div></div>
<div class="shell"><aside class="side"><a class="brand" href="/"><img src="/static/logo.svg" alt="O"><strong>O</strong></a>{{sidebar|safe}}<a class="side-qr" href="/qr"><img src="/qr-image.svg" alt="O QR"><span>O QR<br><small>Always available</small></span></a><button class="btn install-btn" id="installODesktop" style="width:100%;margin-top:8px;display:none">Install O</button><div class="sidefooter">All rights reserved.</div></aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const drawer=document.getElementById('drawer'),openDrawer=document.getElementById('openDrawer');if(openDrawer&&drawer)openDrawer.addEventListener('click',()=>drawer.classList.add('open'));if(drawer)drawer.addEventListener('click',e=>{if(e.target===drawer)drawer.classList.remove('open')});const sideNav=document.querySelector('.side nav');if(sideNav&&drawer){const dn=document.getElementById('drawerNav');dn.innerHTML=sideNav.outerHTML;dn.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>drawer.classList.remove('open')))}
document.querySelectorAll('[data-password-toggle]').forEach(btn=>btn.addEventListener('click',()=>{const i=document.getElementById(btn.dataset.passwordToggle);if(i){i.type=i.type==='password'?'text':'password';btn.textContent=i.type==='password'?'Show':'Hide'}}));
async function deviceContext(){const page=location.pathname;let model='',platform='',browser='';try{const u=navigator.userAgent;if(/Android/i.test(u)){model='Android phone';}else if(/iPhone/i.test(u))model='iPhone';else if(/iPad/i.test(u))model='iPad';else model='Computer';browser=/Edg\//.test(u)?'Edge':/Chrome\//.test(u)?'Chrome':/Safari\//.test(u)?'Safari':/Firefox\//.test(u)?'Firefox':'Browser';platform=/Windows/i.test(u)?'Windows':/Mac/i.test(u)?'macOS':/Android/i.test(u)?'Android':/iPhone|iPad/i.test(u)?'iOS':'Other';}catch(e){model='Unknown device'}const send=(lat=null,lon=null)=>fetch('/api/visitor/context',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page,service:document.body.dataset.service||'',device_model:model,device:platform,browser,lat,lon})}).catch(()=>{});if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>send(p.coords.latitude,p.coords.longitude),()=>send(),{enableHighAccuracy:false,maximumAge:120000,timeout:2500});}else send()}deviceContext();
let deferredInstall=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;document.querySelectorAll('#installO,#installODesktop').forEach(b=>b.style.display='flex')});async function installO(){if(!deferredInstall){alert('Use your browser menu to install O.');return}deferredInstall.prompt();try{const ch=await deferredInstall.userChoice;if(ch.outcome==='accepted')fetch('/api/pwa/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})}).catch(()=>{});}catch(e){}deferredInstall=null;document.querySelectorAll('#installO,#installODesktop').forEach(b=>b.style.display='none')}document.querySelectorAll('#installO,#installODesktop').forEach(b=>b.addEventListener('click',installO));window.addEventListener('appinstalled',()=>fetch('/api/pwa/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:'appinstalled'})}).catch(()=>{}));if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>{% block scripts %}{% endblock %}</body></html>
