<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{ title or 'O-System' }}</title>
<link rel="manifest" href="/static/manifest.json">
<script>document.documentElement.dataset.theme='dark'</script>
<style>
:root{--bg:#07101b;--panel:#0c1724;--panel2:#101d2c;--line:#213246;--text:#f5f7fa;--muted:#91a0b2;--gold:#ffd76a;--green:#58ec94;--blue:#59a9ff;--orange:#ffad43;--red:#ff6377;--white:#fff;}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at top,#102033 0,#07101b 45%,#050b12 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%;}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:rgba(5,12,20,.92);backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:16px;z-index:40}.brand{display:flex;align-items:center;gap:11px;padding:8px}.brand img{width:42px;height:42px;filter:drop-shadow(0 0 12px rgba(255,255,255,.28))}.brand strong{font-size:20px}.side nav{display:flex;flex-direction:column;gap:6px}.navbtn{padding:12px 13px;border-radius:12px;color:#c9d3df;border:1px solid transparent;display:flex;align-items:center;justify-content:space-between}.navbtn:hover,.navbtn.active{background:#111f30;border-color:#22354a;color:#fff}.navsection{margin-top:8px}.navsection h4{text-transform:uppercase;font-size:10px;letter-spacing:.15em;color:#6f8195;padding:0 12px;margin:10px 0 6px}.sidefooter{margin-top:auto;font-size:11px;color:#657487;line-height:1.5}.main{min-width:0}.top{display:none;padding:13px 15px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:35;background:rgba(5,12,20,.9);backdrop-filter:blur(16px)}.hamb{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:#0c1724;color:#fff;font-size:22px}.content{padding:34px;max-width:1500px;margin:auto}.hero{min-height:calc(100vh - 68px);display:grid;place-items:center;text-align:center}.o-big{width:135px;height:135px;margin:auto;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 28px rgba(255,215,106,.22))}.glowtext{font-size:clamp(50px,10vw,110px);font-weight:800;letter-spacing:-.07em;margin:6px 0}.muted{color:var(--muted)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--line);background:#0e1c2b;color:#fff;border-radius:14px;padding:12px 16px;font-weight:700;min-height:46px}.btn:hover{transform:translateY(-1px)}.btn.primary{background:#f4f7fb;color:#09111b;border-color:#fff}.btn.gold{border-color:#66592f;background:rgba(255,215,106,.1);color:var(--gold)}.btn.green{border-color:#275e43;background:rgba(88,236,148,.09);color:var(--green)}.btn.blue{border-color:#285479;background:rgba(89,169,255,.09);color:var(--blue)}.btn.red{border-color:#63323d;background:rgba(255,99,119,.09);color:#ff8a9a}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;gap:16px}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:linear-gradient(180deg,rgba(17,31,46,.94),rgba(10,20,31,.94));border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 14px 44px rgba(0,0,0,.18)}.service-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:26px}.service-btn{min-height:145px;border-radius:18px;border:1px solid #25384d;background:#0e1b2a;padding:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;transition:.18s}.service-btn:hover{transform:translateY(-3px);border-color:#45637e}.service-btn .ico{font-size:42px;line-height:1}.service-btn small{color:var(--muted)}.section-title{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:18px}.section-title h1,.section-title h2{margin:0}.form{display:grid;gap:12px}.label{font-size:12px;color:#9eacbb}.input,.select,.textarea{width:100%;background:#091420;border:1px solid #26384b;color:#fff;border-radius:12px;padding:12px 13px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:#55799c}.textarea{min-height:120px;resize:vertical}.map{height:410px;border-radius:16px;border:1px solid var(--line);overflow:hidden;background:#09131e}.mapbox{height:100%;width:100%}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:15px;border:1px solid var(--line);border-radius:15px;background:#0b1724}.stat b{font-size:26px;display:block;margin-top:4px}.badge{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.status-orange{color:var(--orange);background:rgba(255,173,67,.09);box-shadow:0 0 18px rgba(255,173,67,.15)}.status-green{color:var(--green);background:rgba(88,236,148,.09);box-shadow:0 0 18px rgba(88,236,148,.2)}.status-blue{color:var(--blue);background:rgba(89,169,255,.1);box-shadow:0 0 18px rgba(89,169,255,.2)}.status-red{color:#ff8a9a;background:rgba(255,99,119,.09)}.notice{padding:12px 14px;border:1px solid #29405a;background:#0c1a29;border-radius:12px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #1e3043;text-align:left;font-size:13px}.table th{color:#8090a4;font-weight:700}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:60;display:none}.drawer .panel{width:min(85vw,300px);height:100%;background:#07101b;border-right:1px solid var(--line);padding:18px}.drawer.open{display:block}.hidden{display:none!important}.pill{padding:5px 8px;border:1px solid var(--line);border-radius:99px;font-size:11px}.footer{padding:28px 0 12px;color:#667589;font-size:11px;text-align:center}.split{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.inline{display:flex;gap:8px;align-items:center}.kicker{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#718198}.center{text-align:center}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media(max-width:900px){.shell{display:block}.side{display:none}.top{display:flex;align-items:center;gap:10px}.content{padding:18px 14px}.grid4,.grid3,.service-grid,.statgrid,.split{grid-template-columns:1fr 1fr}.map{height:330px}.hero{min-height:calc(100vh - 82px)}}
@media(max-width:620px){.grid4,.grid3,.service-grid,.statgrid,.split{grid-template-columns:1fr}.service-grid{grid-template-columns:repeat(2,1fr);gap:10px}.service-btn{min-height:125px;padding:12px}.service-btn .ico{font-size:34px}.content{padding:14px}.card{padding:15px}.glowtext{font-size:60px}.o-big{width:110px;height:110px}}
</style>
{% block head %}{% endblock %}</head><body>
<div class="top"><button class="hamb" id="openDrawer" aria-label="menu">☰</button><strong>O-System</strong></div>
<div class="drawer" id="drawer"><div class="panel"><div class="brand"><img src="/static/logo.svg"><strong>O</strong></div><div id="drawerNav"></div><div class="sidefooter">O Mobility<br>All rights reserved.</div></div></div>
<div class="shell">
<aside class="side"><a class="brand" href="/"><img src="/static/logo.svg"><strong>O</strong></a>{{ sidebar|safe }}<div class="sidefooter">O Mobility · O-System V1<br>All rights reserved.</div></aside>
<main class="main"><div class="content">{% block content %}{% endblock %}<div class="footer">O Mobility · All rights reserved.</div></div></main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const drawer=document.getElementById('drawer'),open=document.getElementById('openDrawer');
if(open) open.addEventListener('click',()=>drawer.classList.add('open'));
if(drawer) drawer.addEventListener('click',e=>{if(e.target===drawer)drawer.classList.remove('open')});
const nav=document.querySelector('.side nav'); if(nav&&drawer) document.getElementById('drawerNav').innerHTML=nav.outerHTML;
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}
</script>
{% block scripts %}{% endblock %}</body></html>
