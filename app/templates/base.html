<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14"><meta name="description" content="O — O-Ride, O-Drive, O-Movers and O-Travels."><meta name="robots" content="index,follow">
<link rel="manifest" href="/static/manifest.json"><link rel="icon" href="/static/logo.svg"><link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>{% block title %}O{% endblock %}</title>
<style>
:root{--bg:#07090d;--panel:#10151b;--panel2:#151d25;--text:#f5f7fa;--muted:#8d9aa7;--border:#26323d;--accent:#7cff8b;--side:215px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0,#19252e 0,#07090d 50%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100vh}a{color:inherit;text-decoration:none}.shell{min-height:100vh;display:grid;grid-template-columns:var(--side) 1fr}.sidebar{position:sticky;top:0;height:100vh;padding:22px 14px;background:rgba(6,9,13,.94);border-right:1px solid var(--border);backdrop-filter:blur(16px);display:flex;flex-direction:column}.side-brand{font-weight:1000;font-size:78px;line-height:.8;letter-spacing:-9px;color:#fff;text-shadow:0 0 11px var(--accent),0 0 34px rgba(124,255,139,.55);padding:8px 14px 34px}.side-title{font-size:10px;letter-spacing:2.5px;color:var(--muted);padding:0 12px 10px}.side-links{display:grid;gap:8px}.side-links a{padding:12px 13px;border:1px solid transparent;border-radius:12px;color:#dce4ea}.side-links a:hover,.side-links a.active{background:var(--panel2);border-color:var(--border);color:#fff}.side-links .travels{color:#fff}.side-bottom{margin-top:auto;display:grid;gap:8px}.main{min-width:0}.topbar{position:sticky;top:0;z-index:40;padding:12px 22px;background:rgba(7,9,13,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}.top-title{font-weight:850;letter-spacing:.2px}.top-actions{display:flex;gap:8px;align-items:center}.btn{appearance:none;border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:10px 13px;border-radius:11px;cursor:pointer;font:inherit}.btn.primary{background:var(--accent);color:#061009;border-color:transparent;font-weight:900}.btn.danger{background:#35171a;border-color:#5f2a2e;color:#ffd9da}.btn.small{padding:7px 10px;font-size:13px}.wrap{max-width:1240px;margin:0 auto;padding:28px 24px 56px}.card{background:linear-gradient(180deg,rgba(19,25,32,.97),rgba(11,15,20,.97));border:1px solid var(--border);border-radius:22px;box-shadow:0 18px 60px rgba(0,0,0,.22);padding:19px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent)}.muted,.small{color:var(--muted);font-size:13px}.big{font-size:34px;font-weight:950}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;font-size:13px;color:#dce4ea}.form input,.form select,.form textarea{width:100%;background:#0a0e13;border:1px solid var(--border);color:var(--text);padding:12px;border-radius:12px;font:inherit}.actions{display:flex;gap:9px;flex-wrap:wrap}.map{height:460px;border:1px solid var(--border);border-radius:18px;overflow:hidden}.map-xl{height:520px}.map-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.map-hint{padding:6px 9px;border:1px solid var(--border);border-radius:999px;font-size:11px;color:var(--accent)}.input-row{display:grid;grid-template-columns:1fr auto;gap:8px}.suggestions{position:relative;z-index:30;background:#0a0e13;border:1px solid var(--border);border-radius:12px;overflow:hidden}.suggestion-item{display:block;width:100%;padding:11px 12px;background:transparent;color:var(--text);border:0;border-bottom:1px solid var(--border);text-align:left;cursor:pointer;font:inherit}.suggestion-item:last-child{border-bottom:0}.suggestion-item:hover{background:#141b22}.estimate{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-top:12px}.estimate-large{padding:4px 2px}.fare-value{font-size:40px}.status{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#1a222b;border:1px solid var(--border);font-size:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}.stat{padding:16px}.stat .label{font-size:12px;color:var(--muted)}.notice{padding:12px 14px;border-radius:13px;background:#111820;border:1px solid var(--border)}#toast{position:fixed;right:16px;bottom:16px;z-index:100;padding:12px 14px;background:#121820;border:1px solid var(--border);border-radius:13px;display:none;max-width:360px}.o-home{min-height:calc(100vh - 130px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 10px}.o-mark-main{font-size:clamp(150px,23vw,250px);font-weight:1000;line-height:.7;letter-spacing:-15px;color:#fff;text-shadow:0 0 10px var(--accent),0 0 34px var(--accent),0 0 90px var(--accent);animation:oPulse 1.2s infinite alternate;margin-bottom:30px}.service-heading{font-size:16px;font-weight:900;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:16px}.service-launcher{width:min(940px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.service-button{min-height:104px;border-radius:19px;padding:17px 15px;display:flex;flex-direction:column;justify-content:center;gap:7px;border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 32px rgba(0,0,0,.18);transition:transform .18s,box-shadow .18s}.service-button:hover{transform:translateY(-3px);box-shadow:0 18px 42px rgba(0,0,0,.3)}.service-button span{font-size:23px;font-weight:950}.service-button small{font-size:12px;opacity:.9}.service-button.ride{background:#b78b18;color:#111}.service-button.drive{background:#267a48;color:#fff}.service-button.movers{background:#2d69bd;color:#fff}.service-button.travels{background:#fff;color:#111}.home-actions{display:flex;gap:9px;margin-top:22px}.home-link{padding:9px 13px;border:1px solid var(--border);border-radius:11px;background:var(--panel2);font-size:13px}.request-grid{display:grid;grid-template-columns:minmax(320px,.8fr) minmax(480px,1.2fr);gap:18px;align-items:start}.request-card{position:sticky;top:76px}.payment-box{border:1px solid var(--border);border-radius:14px;padding:12px;background:#0d1319}.payment-title{font-size:12px;color:var(--muted);margin-bottom:9px}.payment-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pay-choice{display:flex!important;grid-template-columns:none!important;gap:7px!important;align-items:center;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:#111820}.pay-choice input{width:auto!important;margin:0}.recent-success{margin-top:18px;border-top:1px solid var(--border);padding-top:14px}.repeat-trip{width:100%;margin-top:8px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:left;background:#0d1319;border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:12px;cursor:pointer;font:inherit}.repeat-trip span:last-child{text-align:right}.arrow{color:var(--accent);font-weight:900}.admin-service-bar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:10px}.service-filter{display:flex;gap:7px;flex-wrap:wrap}.service-filter-btn.active{background:var(--accent);color:#061009;border-color:transparent}.admin-service-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}.admin-service-summary .summary-chip{padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:#0d1319}.provider-head{display:flex;justify-content:space-between;gap:14px;align-items:center}.provider-head h1{margin:.25rem 0;font-size:clamp(34px,5vw,58px);letter-spacing:-2px}.provider-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}.provider-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;margin-top:16px}.provider-layout>.card{min-width:0}.provider-presence{height:max-content}.install-button{display:none}.install-button.ready{display:inline-flex}.install-manual{display:inline-flex}.install-help{display:none}
@keyframes oPulse{from{transform:scale(.97);opacity:.78}to{transform:scale(1.03);opacity:1}}
@media(max-width:960px){.shell{grid-template-columns:185px 1fr}.grid4{grid-template-columns:repeat(2,1fr)}.provider-stats{grid-template-columns:repeat(2,1fr)}.request-grid{grid-template-columns:1fr}.request-card{position:static}.map-xl{height:480px}}
@media(max-width:650px){.shell{display:block}.sidebar{position:sticky;top:0;height:auto;padding:7px 9px;z-index:55;display:block;border-right:0;border-bottom:1px solid var(--border)}.side-brand{display:inline-block;font-size:44px;padding:8px 8px 9px;letter-spacing:-5px}.side-title,.side-bottom{display:none}.side-links{display:flex;gap:6px;overflow:auto;padding:0 2px 4px}.side-links a{white-space:nowrap;padding:7px 9px;font-size:12px}.topbar{top:63px;padding:8px 10px}.top-actions .hide-phone{display:none}.wrap{padding:16px 10px 38px}.card{border-radius:17px;padding:15px}.service-launcher{grid-template-columns:repeat(2,1fr);gap:9px}.service-button{min-height:86px;padding:12px 10px;border-radius:15px}.service-button span{font-size:18px}.service-button small{font-size:11px}.o-mark-main{font-size:155px;margin-bottom:24px}.service-heading{font-size:14px}.home-actions{margin-top:18px}.map{height:390px}.map-xl{height:430px}.map-title{align-items:flex-start;flex-direction:column;gap:5px}.input-row{grid-template-columns:1fr}.payment-options{grid-template-columns:1fr}.provider-layout{grid-template-columns:1fr}.admin-service-bar{align-items:flex-start;flex-direction:column}.admin-service-summary{grid-template-columns:1fr}.provider-stats{grid-template-columns:repeat(2,1fr)}.provider-head h1{font-size:38px}.table{min-width:720px}.estimate{align-items:center}}
</style></head><body>
<div class="shell">
<aside class="sidebar"><a class="side-brand" href="/" aria-label="O home">O</a><div class="side-title">O SERVICES</div><nav class="side-links"><a href="/service/bike" class="{{ 'active' if request.path in ['/service/bike','/O-Ride','/O-Rider'] else '' }}">O-Ride</a><a href="/service/ride" class="{{ 'active' if request.path in ['/service/ride','/O-Drive'] else '' }}">O-Drive</a><a href="/service/mover" class="{{ 'active' if request.path in ['/service/mover','/O-Movers'] else '' }}">O-Movers</a><a class="travels" href="https://otravel-bleg.onrender.com/">O-Travels</a></nav></aside>
<div class="main"><div class="topbar"><div class="top-title">{% block top_title %}O{% endblock %}</div><div class="top-actions"><button id="installButton" class="btn install-button" type="button" onclick="installO()">Install O</button>{% if user and user['role']=='customer' %}<a class="btn small hide-phone" href="/dashboard">My O</a>{% elif not user %}<a class="btn small hide-phone" href="/login">Log in</a>{% endif %}</div></div>
<div class="wrap">{% block content %}{% endblock %}</div></div></div>
<div id="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/static/app.js"></script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}window.addEventListener('load',()=>{if(window.captureVisitorContext)window.captureVisitorContext(false)});</script>{% block scripts %}{% endblock %}</body></html>
