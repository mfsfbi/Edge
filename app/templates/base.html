<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{ title or 'O' }}</title>
<link rel="manifest" href="/static/manifest.json">
<script>document.documentElement.dataset.mode='{{ page_theme or ('dark' if request.path=='/' else 'light') }}'</script>
<style>
.side-qr{margin-top:2px;display:grid;grid-template-columns:46px 1fr;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);font-size:12px;font-weight:800}.side-qr img{width:46px;height:46px;background:#fff;border-radius:8px;padding:3px}.side-qr span{color:var(--text)}.drawer-qr{margin-top:18px}
:root{--bg:#f7f9fc;--panel:#ffffff;--panel2:#f2f5f9;--line:#dfe5ec;--text:#16202a;--muted:#667383;--gold:#bf8d00;--green:#15844d;--blue:#2c6fd6;--orange:#d97800;--red:#c9344c;--white:#fff;}html[data-mode='dark']{--bg:#07101b;--panel:#0c1724;--panel2:#101d2c;--line:#213246;--text:#f5f7fa;--muted:#91a0b2;--gold:#ffd76a;--green:#58ec94;--blue:#59a9ff;--orange:#ffad43;--red:#ff6377;}html[data-mode='cream']{--bg:#fffaf0;--panel:#fffdf8;--panel2:#f7f0df;--line:#e8ddc8;--text:#24302b;--muted:#756e60;--gold:#9b7100;--green:#397957;--blue:#4d74a8;--orange:#b96c00;--red:#c43f52;}html[data-mode='mint']{--bg:#f1fbf7;--panel:#ffffff;--panel2:#e7f5ef;--line:#d1e8dd;--text:#173029;--muted:#5f756d;--gold:#9a7800;--green:#087d4b;--blue:#3d72b8;--orange:#b76e00;--red:#c43c51;}html[data-mode='sky']{--bg:#f2f8ff;--panel:#ffffff;--panel2:#e8f1fb;--line:#d7e4f2;--text:#17263a;--muted:#62758b;--gold:#9a7600;--green:#2e8154;--blue:#1f64c5;--orange:#b56b00;--red:#c23d50;}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%;}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:var(--panel);backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:16px;z-index:40}.brand{display:flex;align-items:center;gap:11px;padding:8px}.brand img{width:42px;height:42px;filter:drop-shadow(0 0 12px rgba(255,255,255,.28))}.brand strong{font-size:20px}.side nav{display:flex;flex-direction:column;gap:6px}.navbtn{padding:12px 13px;border-radius:12px;color:var(--muted);border:1px solid transparent;display:flex;align-items:center;justify-content:space-between}.navbtn:hover,.navbtn.active{background:var(--panel2);border-color:var(--line);color:var(--text)}.navsection{margin-top:8px}.navsection h4{text-transform:uppercase;font-size:10px;letter-spacing:.15em;color:#6f8195;padding:0 12px;margin:10px 0 6px}.sidefooter{margin-top:auto;font-size:11px;color:#657487;line-height:1.5}.main{min-width:0}.top{display:none;padding:13px 15px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:35;background:var(--panel);backdrop-filter:blur(16px)}.hamb{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);display:grid;place-items:center;gap:4px;padding:9px}.hamb span{display:block;width:19px;height:2px;border-radius:4px;background:var(--text)}.content{padding:34px;max-width:1500px;margin:auto}.hero{min-height:calc(100vh - 68px);display:grid;place-items:center;text-align:center}.o-big{width:135px;height:135px;margin:auto;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 28px rgba(255,215,106,.22))}.glowtext{font-size:clamp(50px,10vw,110px);font-weight:800;letter-spacing:-.07em;margin:6px 0}.muted{color:var(--muted)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;padding:12px 16px;font-weight:700;min-height:46px}.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}.btn.gold{border-color:#66592f;background:rgba(255,215,106,.1);color:var(--gold)}.btn.green{border-color:#275e43;background:rgba(88,236,148,.09);color:var(--green)}.btn.blue{border-color:#285479;background:rgba(89,169,255,.09);color:var(--blue)}.btn.red{border-color:#63323d;background:rgba(255,99,119,.09);color:#ff8a9a}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;gap:16px}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 14px 44px rgba(0,0,0,.18)}.service-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:26px}.service-btn{min-height:145px;border-radius:18px;border:1px solid #25384d;background:#0e1b2a;padding:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;transition:.18s}.service-btn:hover{transform:translateY(-3px);border-color:#45637e}.service-btn .ico{font-size:42px;line-height:1}.service-btn small{color:var(--muted)}.section-title{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:18px}.section-title h1,.section-title h2{margin:0}.form{display:grid;gap:12px}.label{font-size:12px;color:var(--muted)}.input,.select,.textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 13px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:#55799c}.textarea{min-height:120px;resize:vertical}.map{height:410px;border-radius:16px;border:1px solid var(--line);overflow:hidden;background:var(--panel2)}.mapbox{height:100%;width:100%}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:15px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}.stat b{font-size:26px;display:block;margin-top:4px}.badge{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.status-orange{color:var(--orange);background:rgba(255,173,67,.09);box-shadow:0 0 18px rgba(255,173,67,.15)}.status-green{color:var(--green);background:rgba(88,236,148,.09);box-shadow:0 0 18px rgba(88,236,148,.2)}.status-blue{color:var(--blue);background:rgba(89,169,255,.1);box-shadow:0 0 18px rgba(89,169,255,.2)}.status-red{color:#ff8a9a;background:rgba(255,99,119,.09)}.notice{padding:12px 14px;border:1px solid var(--line);background:var(--panel2);border-radius:12px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:#8090a4;font-weight:700}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:none;touch-action:none}.drawer .panel{width:min(85vw,300px);height:100%;background:var(--panel);border-right:1px solid var(--line);padding:18px}.drawer.open{display:block}.hidden{display:none!important}.pill{padding:5px 8px;border:1px solid var(--line);border-radius:99px;font-size:11px}.footer{padding:28px 0 12px;color:#667589;font-size:11px;text-align:center}.split{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.inline{display:flex;gap:8px;align-items:center}.kicker{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}.center{text-align:center}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

.entry-stage{min-height:calc(100vh - 70px);display:grid;place-items:center;align-content:center;gap:10px;text-align:center;position:relative;overflow:hidden}.entry-stage:before{content:'';position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(201,52,76,.11),transparent 68%);filter:blur(8px)}.entry-orbit{width:190px;height:190px;position:relative;z-index:1}.entry-orbit svg{width:100%;height:100%;transform:rotate(-90deg)}.o-track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:6}.o-draw{fill:none;stroke:#c9344c;stroke-width:7;stroke-linecap:round;stroke-dasharray:490;stroke-dashoffset:490;animation:drawO 1.9s cubic-bezier(.6,0,.2,1) forwards,redGlow 1.9s ease-in-out forwards}.entry-word{font-size:clamp(34px,6vw,62px);font-weight:800;letter-spacing:-.04em;opacity:0;animation:riseIn .9s .9s ease forwards}.entry-sub{color:var(--muted);font-size:15px;max-width:460px;opacity:0;animation:riseIn .9s 1.35s ease forwards}.entry-continue{opacity:0;pointer-events:none;animation:riseIn .7s 2.15s ease forwards}.entry-stage.ready .entry-continue{pointer-events:auto}.entry-qr{display:flex;align-items:center;gap:12px;margin-top:16px;text-align:left;opacity:0;animation:riseIn .7s 2.3s ease forwards}.entry-qr>div:last-child{display:grid;gap:3px}.entry-qr span{font-size:12px;color:var(--muted)}.qr-placeholder{width:64px;height:64px;border:1px solid var(--line);border-radius:10px;background:#fff;display:grid;place-items:center}.qr-mark{font-size:30px;font-weight:900;color:#c9344c}.entry-stage.leave{animation:fadeAway .5s forwards}.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.theme-option{display:grid;grid-template-columns:auto 46px 1fr;gap:8px 10px;align-items:center;border:1px solid var(--line);background:var(--panel2);padding:12px;border-radius:14px;cursor:pointer}.theme-option input{grid-row:span 2}.theme-option b{grid-column:3}.theme-option small{grid-column:3;color:var(--muted)}.theme-swatch{width:46px;height:46px;border-radius:12px;border:1px solid var(--line)}.light-swatch{background:#fff}.cream-swatch{background:#fff8e9}.mint-swatch{background:#e8f7ef}.sky-swatch{background:#e7f2ff}.success{border-color:#aad8c3!important;color:#176a46}.error{border-color:#edb3bd!important;color:#9b2f43}.service-btn{background:var(--panel);color:var(--text);border-color:var(--line);box-shadow:0 7px 20px rgba(20,35,50,.06)}.service-btn .ico{width:52px;height:52px;display:grid;place-items:center}.service-btn svg{width:48px;height:48px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.service-btn.ride{color:#a66e00}.service-btn.drive{color:#198052}.service-btn.mover{color:#3974c8}.service-btn.travel{color:#6b5bb0}.logged-bright .side,.logged-bright .top{box-shadow:0 4px 18px rgba(20,35,50,.05)}@keyframes drawO{to{stroke-dashoffset:0}}@keyframes redGlow{0%{filter:drop-shadow(0 0 0 rgba(201,52,76,0))}45%{filter:drop-shadow(0 0 14px rgba(201,52,76,.7))}100%{filter:drop-shadow(0 0 20px rgba(201,52,76,.25))}}@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes fadeAway{to{opacity:0;transform:scale(1.03)}}

.mobile-qr{display:none}.status-legend{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.service-note{margin:6px 0 0;font-size:13px}
.logged-bright{background:var(--bg)}
.logged-bright .side{background:var(--panel)}
.entry-stage{background:radial-gradient(circle at center,rgba(201,52,76,.07),transparent 42%)}
.entry-qr{position:relative;z-index:2}
.entry-qr img{width:100%;height:100%;object-fit:contain;border-radius:8px}
.entry-qr .qr-placeholder{padding:0;width:70px;height:70px;display:grid;place-items:center}.qr-large{width:min(300px,75vw);aspect-ratio:1;margin:22px auto;background:#fff;border-radius:18px;padding:12px;box-shadow:0 16px 40px rgba(20,35,50,.12)}.qr-large img{width:100%;height:100%;object-fit:contain}
@media(max-width:900px){.shell{display:block}.side{display:none}.top{display:flex;align-items:center;gap:10px}.content{padding:18px 14px}.grid4,.grid3,.service-grid,.statgrid,.split{grid-template-columns:1fr 1fr}.map{height:330px}.hero{min-height:calc(100vh - 82px)}}
@media(max-width:620px){.grid4,.grid3,.service-grid,.statgrid,.split{grid-template-columns:1fr}.service-grid{grid-template-columns:repeat(2,1fr);gap:10px}.service-btn{min-height:125px;padding:12px}.service-btn .ico{font-size:34px}.content{padding:14px}.card{padding:15px}.glowtext{font-size:60px}.o-big{width:110px;height:110px}}
</style>
{% block head %}{% endblock %}</head><body>
<div class="top"><button class="hamb" id="openDrawer" aria-label="menu"><span></span><span></span><span></span></button><strong>O</strong></div>
<div class="drawer" id="drawer"><div class="panel"><div class="brand"><img src="/static/logo.svg"><strong>O</strong></div><div id="drawerNav"></div><a class="side-qr drawer-qr" href="/qr" aria-label="Open O QR"><img src="/qr-image.png" alt="O QR code"><span>Scan O</span></a><div class="sidefooter">All rights reserved.</div></div></div>
<div class="shell {% if session.get("account_id") %}logged-bright{% endif %}">
<aside class="side"><a class="brand" href="/"><img src="/static/logo.svg"><strong>O</strong></a>{{ sidebar|safe }}<a class="side-qr" href="/qr" aria-label="Open O QR"><img src="/qr-image.png" alt="O QR code"><span>Scan O</span></a><div class="sidefooter">All rights reserved.</div></aside>
<main class="main"><div class="content">{% block content %}{% endblock %}<div class="footer">All rights reserved.</div></div></main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const drawer=document.getElementById('drawer'),open=document.getElementById('openDrawer');
if(open) open.addEventListener('click',()=>drawer.classList.add('open'));
if(drawer) drawer.addEventListener('click',e=>{if(e.target===drawer)drawer.classList.remove('open');});
const nav=document.querySelector('.side nav'); if(nav&&drawer){ document.getElementById('drawerNav').innerHTML=nav.outerHTML; document.getElementById('drawerNav').querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>drawer.classList.remove('open'))); }
document.querySelectorAll('[data-password-toggle]').forEach(btn=>btn.addEventListener('click',()=>{const input=document.getElementById(btn.dataset.passwordToggle); if(!input)return; input.type=input.type==='password'?'text':'password'; btn.textContent=input.type==='password'?'Show':'Hide';}));
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}
</script>
{% block scripts %}{% endblock %}</body></html>
