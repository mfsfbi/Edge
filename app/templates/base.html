<style>
.user-shell{background:linear-gradient(180deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 88%,white) 100%)}
.booking-page{display:grid;position:relative;z-index:1;grid-template-columns:minmax(360px,.9fr) minmax(420px,1.35fr);gap:16px;min-height:calc(100vh - 120px)}
.booking-panel{display:flex;flex-direction:column;gap:12px;min-width:0}

.booking-map-card .mapbox{height:100%;border-radius:17px}
.service-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.service-tab{border:1px solid var(--line);background:var(--panel);cursor:pointer;user-select:none;touch-action:manipulation;border-radius:14px;padding:12px 8px;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:900;transition:.16s ease;box-shadow:0 6px 18px rgba(25,45,65,.05)}
.service-tab:hover,.service-tab.active{transform:translateY(-1px);border-color:#adbcc8;box-shadow:0 10px 22px rgba(25,45,65,.1)}
.service-tab .tab-ico{width:42px;height:42px;box-shadow:0 6px 14px rgba(30,45,60,.08);display:grid;place-items:center;border-radius:11px;background:var(--panel2);border:1px solid var(--line)}
.service-tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:3.3;stroke-linecap:round;stroke-linejoin:round}
.service-tab small{font-size:10px;color:var(--muted)}
.ride-accent{color:#9b6900}.drive-accent{color:#147a46}.mover-accent{color:#2e6ec7}.travel-accent{color:#53616f}
.location-line{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel2);border:1px solid var(--line);padding:9px 11px;border-radius:12px}
.location-dot{width:10px;height:10px;border-radius:50%;background:#c6384d;box-shadow:0 0 0 5px rgba(198,56,77,.11)}
.destination-wrap{position:relative}.suggestions-panel{position:absolute;left:0;right:0;top:100%;z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 15px 35px rgba(25,45,65,.15);overflow:hidden;margin-top:5px}
.suggestion{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);padding:11px 12px;background:var(--panel);color:var(--text)}.suggestion:last-child{border-bottom:0}.suggestion:hover{background:var(--panel2)}
.map-overlay-card{position:absolute;pointer-events:none;left:14px;right:14px;bottom:14px;z-index:500;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border:1px solid rgba(20,35,50,.13);border-radius:14px;padding:11px;box-shadow:0 12px 30px rgba(20,30,45,.15)}
.map-legend{display:flex;gap:8px;flex-wrap:wrap}.map-legend .badge{background:#fff}
.partner-tea{max-width:330px}.partner-tea h3{margin:0 0 3px}.rating-line{display:flex;align-items:center;gap:5px;font-weight:900}.rating-stars{color:#d79616;letter-spacing:1px}.review{padding:9px 0;border-top:1px solid var(--line);font-size:12px}.review:first-of-type{border-top:0}
.request-live{display:none}.request-live.show{display:block}.trip-state{display:flex;align-items:center;justify-content:space-between;gap:10px}.trip-driver{display:grid;grid-template-columns:45px 1fr auto;gap:10px;align-items:center}.avatar{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-weight:900}
@media(max-width:900px){.booking-page{grid-template-columns:1fr;min-height:auto}.booking-map-card{position:relative;z-index:1;top:auto;height:46vh;min-height:320px;order:-1}.service-tabs{grid-template-columns:repeat(4,1fr)}.service-tab{min-height:76px;padding:8px 5px}.service-tab .tab-ico{width:34px;height:34px}.service-tab svg{width:22px;height:22px}.service-tab b{font-size:12px}.service-tab small{display:none}}
@media(max-width:620px){.booking-page{gap:10px}.booking-map-card{height:43vh;min-height:290px}.service-tabs{gap:6px}.service-tab{border-radius:12px;min-height:72px}.booking-panel .card{padding:12px}.trip-driver{grid-template-columns:40px 1fr}.trip-driver .btn{grid-column:1/-1;width:100%}.map-overlay-card{left:8px;right:8px;bottom:8px}.side-qr{margin-top:8px}.sidefooter{margin-top:4px}}

{% block head %}{% endblock %}</head><body class="user-shell">
<div class="top"><button class="hamb" id="openDrawer" aria-label="Open menu"><span></span><span></span><span></span></button><strong>O</strong></div>
<div class="drawer" id="drawer"><div class="panel"><div class="brand"><img src="/static/logo.svg" alt="O"><strong>O</strong></div><div id="drawerNav"></div><a class="side-qr" href="/qr"><img src="/qr-image.svg" alt="O QR"><span>O QR<br><small>Open or scan</small></span></a><button class="btn install-btn" id="installO" style="width:100%;margin-top:8px;display:none">Install O</button><div class="sidefooter">All rights reserved.</div></div></div>
<div class="shell"><aside class="side"><a class="brand" href="/"><img src="/static/logo.svg" alt="O"><strong>O</strong></a>{{sidebar|safe}}<a class="side-qr" href="/qr"><img src="/qr-image.svg" alt="O QR"><span>O QR<br><small>Always available</small></span></a><button class="btn install-btn" id="installODesktop" style="width:100%;margin-top:8px;display:none">Install O</button><div class="sidefooter">All rights reserved.</div></aside>
<main class="main"><div class="content">{% block content %}{% endblock %}<div class="footer">All rights reserved.</div></div></main></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const drawer=document.getElementById('drawer'),openDrawer=document.getElementById('openDrawer');
if(openDrawer&&drawer)openDrawer.addEventListener('click',()=>drawer.classList.add('open'));
if(drawer)drawer.addEventListener('click',e=>{if(e.target===drawer)drawer.classList.remove('open')});
const sideNav=document.querySelector('.side nav');if(sideNav&&drawer){const dn=document.getElementById('drawerNav');dn.innerHTML=sideNav.outerHTML;dn.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>drawer.classList.remove('open')))}
document.querySelectorAll('[data-password-toggle]').forEach(btn=>btn.addEventListener('click',()=>{const i=document.getElementById(btn.dataset.passwordToggle);if(i){i.type=i.type==='password'?'text':'password';btn.textContent=i.type==='password'?'Show':'Hide'}}));
async function deviceContext(){let model='',platform='',browser='';try{if(navigator.userAgentData){const d=await navigator.userAgentData.getHighEntropyValues(['model','platform','platformVersion','fullVersionList','mobile']);model=d.model||'';platform=d.platform||'';browser=(d.fullVersionList||[])[0]?.brand||'';if(!model&&d.mobile)model=platform==='Android'?'Android phone':platform==='iOS'?'iPhone':platform;}else{const u=navigator.userAgent;if(/Android/i.test(u)){model=(u.match(/Android[^;]*;\s*([^;)]+)[;)]/)||[])[1]||'Android phone';}else if(/iPhone/i.test(u))model='iPhone';else if(/iPad/i.test(u))model='iPad';else model='Computer';browser=/Edg\//.test(u)?'Edge':/Chrome\//.test(u)?'Chrome':/Safari\//.test(u)?'Safari':/Firefox\//.test(u)?'Firefox':'Browser';platform=/Windows/i.test(u)?'Windows':/Mac/i.test(u)?'macOS':/Android/i.test(u)?'Android':/iPhone|iPad/i.test(u)?'iOS':'Other';}}catch(e){model='Unknown device'}const page=location.pathname;const send=(lat=null,lon=null)=>fetch('/api/visitor/context',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page,service:document.body.dataset.service||'',device_model:model,device:platform,browser,lat,lon})}).catch(()=>{});if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>send(p.coords.latitude,p.coords.longitude),()=>send(),{enableHighAccuracy:false,maximumAge:120000,timeout:2500});}else send();}
deviceContext();

let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;document.querySelectorAll('#installO,#installODesktop').forEach(b=>b.style.display='flex')});
async function installO(){if(!deferredInstall){alert('Use your browser menu to install O.');return}deferredInstall.prompt();try{const ch=await deferredInstall.userChoice;if(ch.outcome==='accepted')fetch('/api/pwa/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})}).catch(()=>{});}catch(e){}deferredInstall=null;document.querySelectorAll('#installO,#installODesktop').forEach(b=>b.style.display='none')}
document.querySelectorAll('#installO,#installODesktop').forEach(b=>b.addEventListener('click',installO));
window.addEventListener('appinstalled',()=>fetch('/api/pwa/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:'appinstalled'})}).catch(()=>{}));
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>{% block scripts %}{% endblock %}</body></html>
