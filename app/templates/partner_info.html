{% extends 'base.html' %}
{% block content %}<div style="max-width:720px;margin:auto"><div class="kicker">{{heading}}</div><h1>{{partner.name}}</h1><div class="card" style="margin-top:14px"><div class="kicker"><span class="sw">Mapato</span><span class="en">Earnings</span></div><div style="font-size:38px;font-weight:950;margin:6px 0">{{message}}</div><div class="small"><span class="sw">Hii ni jumla ya safari zilizorekodiwa na O.</span><span class="en">This is the total recorded by O from completed jobs.</span></div></div></div><script>const lang=localStorage.getItem('partnerLang')||'sw';document.querySelectorAll('.sw').forEach(x=>x.style.display=lang==='sw'?'inline':'none');document.querySelectorAll('.en').forEach(x=>x.style.display=lang==='en'?'inline':'none');</script>{% endblock %}
