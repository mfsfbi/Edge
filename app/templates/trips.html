{% extends 'base.html' %}{% block content %}<div class="section-title"><div><div class="kicker">Your O</div><h1>My trips</h1></div></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Service</th><th>From</th><th>To</th><th>Fare</th><th>Status</th></tr></thead><tbody>{% for t in trips %}<tr><td>{{t.service}}</td><td>{{t.pickup_name}}</td><td>{{t.destination_name}}</td><td>KES {{t.fare or 0}}</td><td>{{t.status}}</td></tr>{% else %}<tr><td colspan="5" class="muted">No trips yet.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
