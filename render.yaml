services:
  - type: web
    name: o-mobility
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: O_NAME
        value: O
      - key: DATA_DIR
        value: /var/data
