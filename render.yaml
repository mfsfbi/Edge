services:
  - type: web
    name: o-system-v1
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: USER_NAME
        sync: false
      - key: PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: o-data
      mountPath: /var/data
      sizeGB: 1
