services:
  - type: web
    name: o-system-v1
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: USER_NAME
        sync: false
      - key: PASSWORD
        sync: false
    disk:
      name: o-data
      mountPath: /var/data
      sizeGB: 1
